name: devsecops-pipeline
on: [push, pull_request]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/owasp-top-ten lab-app/ --error

      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          pip-audit -r lab-app/requirements.txt

      - name: Build de la imagen de la aplicacion
        run: docker build -t taller-waap/app:${{ github.sha }} ./lab-app

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'taller-waap/app:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: IaC scan - Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: lab-app
          quiet: true

      - name: Levantar app para DAST
        run: |
          docker run -d --name waap-app -p 8080:8080 'taller-waap/app:${{ github.sha }}'
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors http://localhost:8080/health >/dev/null

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'

      - name: Despliegue de reglas WAAP (solo si todo pasa)
        if: success()
        env:
          IMAGE: 'taller-waap/app:${{ github.sha }}'
        run: ./scripts/deploy_waap_rules.sh